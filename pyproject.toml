[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer"
version = "1.0.0"
description = "Analyse and rewrite rough prompts into effective, fully specified ones."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["prompt-engineering", "llm", "gemini", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
prompt-optimizer = "prompt_optimizer.cli:main"

[project.urls]
Repository = "https://github.com/SdSarthak/Prompt-Optimizer"

[tool.setuptools]
packages = ["prompt_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
